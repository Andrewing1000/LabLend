# Puerta de entrada del entorno publicado: sirve la aplicación Flutter
# compilada para web y reenvía al backend Django las rutas que le pertenecen.
# Así la aplicación y la API comparten el mismo origen y no hace falta CORS.

upstream lablend_api {
    server app_new:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # D8. Lo que llegue por HTTP se redirige a HTTPS. Django ya lo hace para
    # sus propias rutas, pero la aplicación Flutter la sirve este nginx, así
    # que sin esto la pantalla principal seguiría abriéndose en claro.
    # Cuando la cabecera viene vacía la petición es local (no pasó por el
    # túnel) y no se redirige, para no romper las comprobaciones de estado.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # HSTS para todas las respuestas, incluidas las de la aplicación: si solo
    # lo enviara Django, quien entre por la pantalla principal nunca recibiría
    # la política. En las rutas del backend se oculta la copia de Django para
    # no enviar la cabecera dos veces.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Archivos subidos (MEDIA_URL = /static/media/, MEDIA_ROOT = /vol/web/media).
    location /static/media/ {
        alias /vol/web/media/;
        expires 7d;
    }

    # Archivos estáticos de Django, recogidos con collectstatic.
    location /static/ {
        alias /vol/web/static/;
        expires 7d;
    }

    # Rutas del backend (backend/app/app/urls.py).
    location ~ ^/(user|item|loan|api)/ {
        proxy_pass http://lablend_api;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location = /health_check {
        proxy_pass http://lablend_api;
        proxy_hide_header Strict-Transport-Security;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # La aplicación Flutter. No se usa un comodín hacia index.html: la
    # aplicación se sirve siempre desde la raíz y navega por un parámetro de
    # consulta (main_frame.dart lee Uri.base.queryParameters['enlace']), no
    # por rutas. Con el comodín, cualquier ruta inexistente devolvía la
    # aplicación con un 200, incluido /admin/, que según D9 debe dar 404.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }
}
