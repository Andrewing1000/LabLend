# Sustituye el servidor de desarrollo de Django por Gunicorn en el entorno
# publicado (D8). El archivo del repositorio sigue usando runserver, que es
# lo que conviene en desarrollo por la recarga en caliente.
#
# Se aplica encima de backend/docker-compose.yml:
#   docker compose -p lablend -f backend/docker-compose.yml \
#       -f hosting/compose.backend.yml --env-file backend/.env up -d
#
# Los archivos estáticos no los sirve Gunicorn: los entrega el nginx de
# hosting/nginx.conf desde el volumen de estáticos.

services:
  app_new:
    # 3 trabajadores: cada inicio de sesión o cambio de contraseña usa unos
    # 100 MiB con Argon2id, así que subir este número cuesta memoria.
    # --no-control-socket: el socket de control de Gunicorn se crea en el
    # directorio personal del usuario, y la imagen crea django-user sin uno
    # (--no-create-home en el Dockerfile). El sistema no usa ese socket.
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             gunicorn app.wsgi:application --bind 0.0.0.0:8000 --workers 3 --no-control-socket --access-logfile - --error-logfile -"
    # El archivo del repositorio publica 8000 en 0.0.0.0, lo que deja el
    # backend accesible desde la red salteandose el proxy. Eso no solo lo
    # expone: con SECURE_PROXY_SSL_HEADER activo, quien llegue directo puede
    # enviar X-Forwarded-Proto: https y Django tratara como segura una
    # conexion en claro. nginx llega por la red de Docker, asi que aqui el
    # puerto queda solo para depuracion desde la propia maquina.
    ports: !override
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
