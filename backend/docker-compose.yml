version: "3.9"

services:
  app_new:                                  #Service name
    build:
      context: .
      args:
        - DEV=true
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - dev-static-data:/vol/web
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    env_file:
      - .env                                # DJANGO_SECRET_KEY, DB_NAME, DB_USER, DB_PASS
    environment:
      - DB_HOST=db
    depends_on:
      - db


  db:
    image: postgres:17-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:                      # Valores de backend/.env
      - POSTGRES_DB=${DB_NAME:?Falta DB_NAME en backend/.env}
      - POSTGRES_USER=${DB_USER:?Falta DB_USER en backend/.env}
      - POSTGRES_PASSWORD=${DB_PASS:?Falta DB_PASS en backend/.env}
volumes:
  dev-db-data: #volume name, if left blank docker will assign it automatically
  dev-static-data: